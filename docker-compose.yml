services:
  postgres:
    image: postgres:16-alpine
    container_name: tennishub-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tennishub}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tennishub_secret}
      POSTGRES_DB: ${POSTGRES_DB:-tennishub_db}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tennishub} -d ${POSTGRES_DB:-tennishub_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tennishub-app
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-tennishub}:${POSTGRES_PASSWORD:-tennishub_secret}@postgres:5432/${POSTGRES_DB:-tennishub_db}
      NODE_ENV: production
      PORT: 3000
    ports:
      - "3000:3000"

volumes:
  pgdata:
